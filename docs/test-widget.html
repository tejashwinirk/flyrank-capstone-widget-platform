<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FlyRank Widget Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .info {
            padding: 12px 16px;
            margin-bottom: 25px;
            background: #f0f4ff;
            border-radius: 8px;
            font-size: 14px;
        }

        #widget-container {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>FlyRank Lead Capture Widget</h1>

        <div class="info">
            This page represents a separate website origin.
            The FlyRank widget is loaded from the API server.
        </div>

        <div id="widget-container"></div>

    </div>

    <!--
        Replace WIDGET_ID below with the ID of an active widget
        created through the authenticated API.
    -->

    <script
        src="http://127.0.0.1:8001/public/embed/WIDGET_ID.js"
        data-widget-id="WIDGET_ID"
        async>
    </script>

</body>

</html>
